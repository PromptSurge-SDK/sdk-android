services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: promptsurge
      POSTGRES_USER: promptsurge
      POSTGRES_PASSWORD: promptsurge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptsurge -d promptsurge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
