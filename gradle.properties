org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Single source of truth for the Android SDK version. Feeds both BuildConfig.SDK_VERSION (what
# every telemetry event reports) and the Maven publication coordinate. These used to disagree:
# events said 0.0.1 while the artifact published as 0.1.0, so no dashboard number could be
# trusted to mean a version anyone had actually installed.
VERSION_NAME=1.3.1
